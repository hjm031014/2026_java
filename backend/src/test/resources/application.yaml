spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  seed:
    reference-data: false
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: test-secret-key-for-unit-tests-only-32bytes-min
  cookie:
    secure: false
    same-site: Lax

cloudinary:
  url: ""

zonky:
  test:
    database:
      provider: zonky
