spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: test-secret-key-for-unit-tests-only-32bytes-min
  cookie:
    secure: false
    same-site: Lax

cloudinary:
  url: ""
