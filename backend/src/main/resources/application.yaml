spring:
  application:
    name: team-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus_marketplace}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:please-change-this-dev-only-secret-key-32bytes-minimum}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:900}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:None}
    domain: ${COOKIE_DOMAIN:}

cloudinary:
  url: ${CLOUDINARY_URL:}

logging:
  level:
    com.nsu.team: ${LOG_LEVEL:INFO}
